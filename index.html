    <!-- Automatic clean URL rewrite (removes legacy /#/ immediately from address bar) -->
    <script type="text/javascript">
      (function(l) {
        if (l.hash && (l.hash === '#/' || l.hash === '#')) {
          window.history.replaceState(null, '', l.pathname + l.search);
        } else if (l.hash && l.hash.startsWith('#/')) {
          var cleanRoute = l.hash.slice(2);
          var basePath = l.pathname.replace(/\/+$/, '');
          var target = (basePath + '/' + cleanRoute).replace(/\/+/g, '/');
          window.history.replaceState(null, '', target + l.search);
        }
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
