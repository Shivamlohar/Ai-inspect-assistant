<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Hardened Blue Team Zero-Trust Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
    
    <!-- Permissions Policy to restrict sensitive hardware APIs -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" />

    <!-- Title & SEO Branding -->
    <title>AI Inspection Assistance | Real-Time Infrastructure & Machine Diagnostics</title>
    <meta name="description" content="AI-Powered Real-Time Asset Inspection Assistance for field inspectors, engineers, and maintenance teams. Inspect Smarter, Detect Earlier, Maintain Better." />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Open Graph for Social Previews -->
    <meta property="og:title" content="AI Inspection Assistance" />
    <meta property="og:description" content="Inspect Smarter. Detect Earlier. Maintain Better. AI-powered real-time asset & infrastructure inspection software." />
    <meta property="og:type" content="website" />

    <!-- Responsive & Accessible Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230ea5e9'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l5.09-5.09 1.41 1.41L11 16.5z'/></svg>" />
    
    <!-- Google Fonts for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-primary/20 selection:text-primary">
